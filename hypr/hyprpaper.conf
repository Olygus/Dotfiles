# Hyprpaper Configuration for v0.8.0+
# New syntax uses wallpaper { } blocks instead of preload/wallpaper lines
misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
}
# Wallpaper for laptop screen (eDP-1)
wallpaper {
    monitor = eDP-1
    path = ~/.config/assets/wallpapers/wp1.png

    fit_mode = cover
}

# Options (set outside wallpaper blocks)
splash = false
# ipc = off
